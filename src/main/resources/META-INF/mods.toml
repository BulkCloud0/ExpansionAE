modLoader="javafml"
loaderVersion="[36,)"
license="LGPL-3.0"
issueTrackerURL="https://github.com/BulkCloud0/ExpansionAE/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/BulkCloud0/ExpansionAE"
description='''
A unified Applied Energistics 2 expansion for Minecraft 1.16.5.
ExpansionAE reimplements selected storage, automation, networking and
cross-mod integration features behind a coherent AE2 8.4.7 architecture.
'''

[[dependencies.expansionae]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.expansionae]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.expansionae]]
    modId="appliedenergistics2"
    mandatory=true
    versionRange="${ae2_version_range}"
    ordering="AFTER"
    side="BOTH"

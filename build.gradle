buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:4.1.16' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'

// ForgeGradle 4.1's SRG -> MCP writer does not create this parent directory
// on a clean cache. This MCP config is the one pinned by Forge 36.2.42.
new File(gradle.gradleUserHomeDir,
    'caches/forge_gradle/minecraft_user_repo/de/oceanlabs/mcp/mcp_config/1.16.5-20210115.111550').mkdirs()

group = 'dev.bulkcloud.expansionae'
version = "${minecraft_version}-${mod_version}"
archivesBaseName = 'ExpansionAE'
sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    mappings channel: 'snapshot', version: '20210309-1.16.5'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            workingDirectory project.file('run')
            if (project.hasProperty('smokeTest')) property 'expansionae.smokeTest', 'true'
            mods { expansionae { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            mods { expansionae { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://modmaven.dev' }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("appeng:appliedenergistics2:${ae2_version}")
    testImplementation 'junit:junit:4.13.2'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    from('LICENSE')
    from('NOTICE.md')
    manifest { attributes 'Implementation-Version': project.version }
    finalizedBy 'reobfJar'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'planning/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Dedicated server smoke test
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p run
          rm -rf run/logs run/crash-reports
          printf 'eula=true\n' > run/eula.txt

          setsid ./gradlew --no-daemon runServer > run/server-smoke.out 2>&1 &
          server_pid=$!
          ready=0

          for _ in $(seq 1 90); do
            if [ -f run/logs/latest.log ] && grep -q "Done (" run/logs/latest.log; then
              ready=1
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Dedicated server never reached the ready state."
            if [ -f run/logs/latest.log ]; then
              cat run/logs/latest.log
            else
              cat run/server-smoke.out
            fi
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            exit 1
          fi

          if find run/crash-reports -maxdepth 1 -type f -print -quit 2>/dev/null | grep -q .; then
            echo "A dedicated-server crash report was generated."
            find run/crash-reports -maxdepth 1 -type f -print
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            exit 1
          fi

          if ! grep -q "AE2 API available; registered ExpansionAE cell handlers" run/logs/latest.log; then
            echo "ExpansionAE did not register its AE2 cell handler."
            cat run/logs/latest.log
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            exit 1
          fi

          if ! grep -q "DISK workbench contract validated" run/logs/latest.log; then
            echo "DISK workbench runtime validation did not complete."
            cat run/logs/latest.log
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            exit 1
          fi

          echo "Dedicated server reached the ready state with AE2 cell registration and DISK workbench validation."

          kill -INT -- "-$server_pid" 2>/dev/null || true
          for _ in $(seq 1 15); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill -TERM -- "-$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true

      - name: Upload development JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExpansionAE-dev
          path: build/libs/*.jar

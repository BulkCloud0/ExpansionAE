name: Forge 1.16.5 build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expansionae-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: forge-1.16.5-36.2.42-ae2-8.4.7-v1
      - name: Build and reobfuscate
        run: bash ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: ExpansionAE-1.16.5-development
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Package source snapshot
        run: git archive --format=zip --output=ExpansionAE-1.16.5-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ExpansionAE-1.16.5-source
          path: ExpansionAE-1.16.5-source.zip
          if-no-files-found: error
      - name: Client startup and registry smoke test
        run: |
          rm -f run/expansionae-smoke-ok.txt
          for attempt in 1 2 3; do
            if timeout 240s xvfb-run -a bash ./gradlew --no-daemon runClient -PsmokeTest && test -f run/expansionae-smoke-ok.txt; then
              exit 0
            fi
            rm -f run/expansionae-smoke-ok.txt
            echo "Smoke test attempt ${attempt} failed; retrying."
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExpansionAE-validation-logs
          path: |
            run/logs/latest.log
            run/crash-reports/
            run/expansionae-smoke-ok.txt
            build/reports/tests/
          if-no-files-found: ignore

name: Build

on:
  push:
    branches:
      - main
      - 'planning/**'
      - 'feature/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Upload development JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExpansionAE-dev
          path: build/libs/*.jar
          if-no-files-found: error

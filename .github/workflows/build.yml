name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'planning/**'
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Dedicated server smoke test
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          enable-rcon=true
          rcon.password=expansionae-ci
          rcon.port=25575
          broadcast-rcon-to-ops=false
          online-mode=false
          level-name=world
          motd=ExpansionAE CI
          EOF

          dump_server_failure() {
            local phase="$1"
            echo "Dedicated server validation failed during phase: $phase"
            if [ -f run/logs/latest.log ]; then
              cat run/logs/latest.log
            elif [ -f "run/server-$phase.out" ]; then
              cat "run/server-$phase.out"
            fi
            for crash in run/crash-reports/*; do
              [ -f "$crash" ] || continue
              echo "===== $crash ====="
              cat "$crash"
            done
          }

          send_rcon_stop() {
            python3 <<'PY'
          import socket
          import struct

          HOST = "127.0.0.1"
          PORT = 25575
          PASSWORD = "expansionae-ci"

          def recv_exact(sock, count):
              data = b""
              while len(data) < count:
                  chunk = sock.recv(count - len(data))
                  if not chunk:
                      raise RuntimeError("RCON connection closed unexpectedly")
                  data += chunk
              return data

          def send_packet(sock, request_id, packet_type, payload):
              body = struct.pack("<ii", request_id, packet_type) + payload.encode("utf-8") + b"\x00\x00"
              sock.sendall(struct.pack("<i", len(body)) + body)

          def receive_packet(sock):
              length = struct.unpack("<i", recv_exact(sock, 4))[0]
              body = recv_exact(sock, length)
              request_id, packet_type = struct.unpack("<ii", body[:8])
              return request_id, packet_type, body[8:-2].decode("utf-8", errors="replace")

          with socket.create_connection((HOST, PORT), timeout=5) as sock:
              send_packet(sock, 1, 3, PASSWORD)
              request_id, _, _ = receive_packet(sock)
              if request_id == -1:
                  raise RuntimeError("RCON authentication failed")
              send_packet(sock, 2, 2, "stop")

          print("RCON stop command sent")
          PY
          }

          stop_server() {
            local server_pid="$1"

            if ! send_rcon_stop; then
              echo "Failed to send the RCON stop command."
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              return 1
            fi

            for _ in $(seq 1 60); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                wait "$server_pid" 2>/dev/null || true
                return 0
              fi
              sleep 1
            done

            echo "Server did not stop cleanly after the RCON stop command."
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            return 1
          }

          run_server_phase() {
            local phase="$1"
            local phase_marker="$2"
            local server_pid
            local ready=0
            local validated=0

            rm -rf run/logs run/crash-reports

            EXPANSIONAE_PERSISTENCE_PHASE="$phase" \
              setsid ./gradlew --no-daemon runServer \
              > "run/server-$phase.out" 2>&1 &
            server_pid=$!

            for _ in $(seq 1 90); do
              if [ -f run/logs/latest.log ] && grep -q "Done (" run/logs/latest.log; then
                ready=1
                break
              fi

              if ! kill -0 "$server_pid" 2>/dev/null; then
                break
              fi

              sleep 2
            done

            if [ "$ready" -ne 1 ]; then
              dump_server_failure "$phase"
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              exit 1
            fi

            for _ in $(seq 1 20); do
              if [ -f run/logs/latest.log ] \
                && grep -q "AE2 API available; registered ExpansionAE cell handlers" run/logs/latest.log \
                && grep -q "DISK workbench contract validated" run/logs/latest.log \
                && grep -q "DISK storage runtime validated" run/logs/latest.log \
                && grep -q "DISK active grid runtime validated" run/logs/latest.log \
                && grep -q "$phase_marker" run/logs/latest.log; then
                validated=1
                break
              fi

              if ! kill -0 "$server_pid" 2>/dev/null; then
                break
              fi

              sleep 1
            done

            if find run/crash-reports -maxdepth 1 -type f -print -quit 2>/dev/null | grep -q .; then
              dump_server_failure "$phase"
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              exit 1
            fi

            if [ "$validated" -ne 1 ]; then
              echo "Expected runtime validation markers were not observed."
              dump_server_failure "$phase"
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              exit 1
            fi

            echo "Dedicated server phase '$phase' reached ready state and passed all runtime assertions."

            if ! stop_server "$server_pid"; then
              dump_server_failure "$phase"
              exit 1
            fi
          }

          run_server_phase "write" "DISK persistence write phase validated"
          run_server_phase "read" "DISK persistence read phase validated"

          echo "Dedicated server restart persistence smoke test passed with clean RCON shutdowns."

      - name: Client model smoke test
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

          rm -rf run/logs run/crash-reports
          mkdir -p run

          setsid xvfb-run -a ./gradlew --no-daemon runClient > run/client.out 2>&1 &
          client_pid=$!
          validated=0

          dump_client_failure() {
            echo "Client model smoke test failed."
            if [ -f run/logs/latest.log ]; then
              cat run/logs/latest.log
            elif [ -f run/client.out ]; then
              cat run/client.out
            fi
            for crash in run/crash-reports/*; do
              [ -f "$crash" ] || continue
              echo "===== $crash ====="
              cat "$crash"
            done
          }

          stop_client() {
            kill -TERM -- "-$client_pid" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$client_pid" 2>/dev/null; then
                wait "$client_pid" 2>/dev/null || true
                return 0
              fi
              sleep 1
            done
            kill -KILL -- "-$client_pid" 2>/dev/null || true
            wait "$client_pid" 2>/dev/null || true
          }

          for _ in $(seq 1 120); do
            if [ -f run/logs/latest.log ] \
              && grep -q "Registered and queued 1k/4k/16k/64k DISK drive models" run/logs/latest.log \
              && grep -q "DISK client model bake validation passed" run/logs/latest.log; then
              validated=1
              break
            fi

            if find run/crash-reports -maxdepth 1 -type f -print -quit 2>/dev/null | grep -q .; then
              break
            fi

            if ! kill -0 "$client_pid" 2>/dev/null; then
              break
            fi

            sleep 2
          done

          if [ "$validated" -ne 1 ]; then
            dump_client_failure
            stop_client
            exit 1
          fi

          echo "Client reached model bake with all ExpansionAE DISK item/Drive models present."
          stop_client

      - name: Upload development JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExpansionAE-dev
          path: build/libs/*.jar

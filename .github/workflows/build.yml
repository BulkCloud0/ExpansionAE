name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'planning/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Dedicated server smoke test
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          set +e
          timeout --signal=INT --kill-after=30s 180s ./gradlew --no-daemon runServer
          status=$?
          set -e

          if [ ! -f run/logs/latest.log ]; then
            echo "Dedicated server did not create run/logs/latest.log"
            exit 1
          fi

          if ! grep -q "Done (" run/logs/latest.log; then
            echo "Dedicated server never reached the ready state."
            cat run/logs/latest.log
            exit 1
          fi

          if find run/crash-reports -type f -print -quit 2>/dev/null | grep -q .; then
            echo "A dedicated-server crash report was generated."
            find run/crash-reports -type f -maxdepth 1 -print
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 130 ]; then
            echo "runServer exited unexpectedly with status $status"
            exit "$status"
          fi

          echo "Dedicated server reached the ready state successfully."

      - name: Upload development JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExpansionAE-dev
          path: build/libs/*.jar

name: Forge 1.16.5 build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: forge-1.16.5-36.2.42-ae2-8.4.7-v1
      - name: Build and reobfuscate
        run: bash ./gradlew --no-daemon clean build
      - name: Client startup and registry smoke test
        run: |
          timeout 240s xvfb-run -a bash ./gradlew --no-daemon runClient -PsmokeTest
          test -f run/expansionae-smoke-ok.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExpansionAE-validation-logs
          path: |
            run/logs/latest.log
            run/crash-reports/
            run/expansionae-smoke-ok.txt
            build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ExpansionAE-1.16.5-development
          path: build/libs/*.jar
          if-no-files-found: error

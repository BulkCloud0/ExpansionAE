name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'planning/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Dedicated server smoke test
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          dump_server_failure() {
            local phase="$1"
            echo "Dedicated server validation failed during phase: $phase"
            if [ -f run/logs/latest.log ]; then
              cat run/logs/latest.log
            elif [ -f "run/server-$phase.out" ]; then
              cat "run/server-$phase.out"
            fi
            for crash in run/crash-reports/*; do
              [ -f "$crash" ] || continue
              echo "===== $crash ====="
              cat "$crash"
            done
          }

          stop_server() {
            local server_pid="$1"

            printf 'stop\n' >&3 || true
            exec 3>&-

            for _ in $(seq 1 45); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                wait "$server_pid" 2>/dev/null || true
                return 0
              fi
              sleep 1
            done

            echo "Server did not stop cleanly after the stop command; terminating the process group."
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          run_server_phase() {
            local phase="$1"
            local phase_marker="$2"
            local server_pid
            local ready=0
            local validated=0

            rm -rf run/logs run/crash-reports
            rm -f run/server-stdin
            mkfifo run/server-stdin
            exec 3<>run/server-stdin

            EXPANSIONAE_PERSISTENCE_PHASE="$phase" \
              setsid ./gradlew --no-daemon runServer \
              < run/server-stdin > "run/server-$phase.out" 2>&1 &
            server_pid=$!

            for _ in $(seq 1 90); do
              if [ -f run/logs/latest.log ] && grep -q "Done (" run/logs/latest.log; then
                ready=1
                break
              fi

              if ! kill -0 "$server_pid" 2>/dev/null; then
                break
              fi

              sleep 2
            done

            if [ "$ready" -ne 1 ]; then
              dump_server_failure "$phase"
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              exec 3>&-
              wait "$server_pid" 2>/dev/null || true
              exit 1
            fi

            for _ in $(seq 1 20); do
              if [ -f run/logs/latest.log ] \
                && grep -q "AE2 API available; registered ExpansionAE cell handlers" run/logs/latest.log \
                && grep -q "DISK workbench contract validated" run/logs/latest.log \
                && grep -q "DISK storage runtime validated" run/logs/latest.log \
                && grep -q "$phase_marker" run/logs/latest.log; then
                validated=1
                break
              fi

              if ! kill -0 "$server_pid" 2>/dev/null; then
                break
              fi

              sleep 1
            done

            if find run/crash-reports -maxdepth 1 -type f -print -quit 2>/dev/null | grep -q .; then
              dump_server_failure "$phase"
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              exec 3>&-
              wait "$server_pid" 2>/dev/null || true
              exit 1
            fi

            if [ "$validated" -ne 1 ]; then
              echo "Expected runtime validation markers were not observed."
              dump_server_failure "$phase"
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              exec 3>&-
              wait "$server_pid" 2>/dev/null || true
              exit 1
            fi

            echo "Dedicated server phase '$phase' reached ready state and passed all runtime assertions."
            stop_server "$server_pid"
            rm -f run/server-stdin
          }

          run_server_phase "write" "DISK persistence write phase validated"
          run_server_phase "read" "DISK persistence read phase validated"

          echo "Dedicated server restart persistence smoke test passed."

      - name: Upload development JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExpansionAE-dev
          path: build/libs/*.jar

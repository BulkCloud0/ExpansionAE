name: Forge 1.16.5 build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build and reobfuscate
        run: bash ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: ExpansionAE-1.16.5-development
          path: build/libs/*.jar
          if-no-files-found: error
